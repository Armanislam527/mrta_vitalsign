# World layout and robot/patient counts. Loaded onto the ROS param server.

num_robots: 3
num_patients: 5
world_frame: map
rng_seed: 7

sensing_range: 2.0          # rPPG camera range (m)
env_zone_radius: 3.0        # which patient zone env sensors report
dwell_time_required: 3.0    # seconds stopped at a patient to count as a visit

battery_full: 1.0
battery_drain_per_mps: 0.004

patient_positions:
  - {x: 3.0, y: 1.5, z: 0.0}
  - {x: 6.0, y: 2.0, z: 0.0}
  - {x: 8.5, y: 5.0, z: 0.0}
  - {x: 4.0, y: 6.5, z: 0.0}
  - {x: 1.5, y: 4.5, z: 0.0}
  - {x: 2.0, y: 1.0, z: 0.0}
  - {x: 7.0, y: 3.5, z: 0.0}
  - {x: 5.0, y: 7.0, z: 0.0}
  - {x: 1.0, y: 2.0, z: 0.0}
  - {x: 8.0, y: 6.0, z: 0.0}
  

robot_start_poses:
  - {x: 0.6, y: 0.6, yaw: 0.0}
  - {x: 0.6, y: 1.8, yaw: 0.0}
  - {x: 0.6, y: 3.0, yaw: 0.0}

sensor_noise:
  hr_std: 2.5
  rr_std: 0.8
  hrv_std: 0.04
  temp_std: 0.15
  noise_std: 1.5

navigator:
  arrive_radius: 0.4
  kp_lin: 0.8
  kp_ang: 2.0
  v_max: 0.6
  w_max: 1.2
